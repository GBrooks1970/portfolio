name: Portfolio quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: portfolio-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out landing repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: landing

      - name: Check out canonical registry history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NeoCognitus70/portfolio-prompts
          fetch-depth: 0
          persist-credentials: false
          path: registry

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install registry parser
        working-directory: landing
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run complete portfolio gate
        working-directory: landing
        run: python tools/verify_portfolio.py --registry-repository ../registry
